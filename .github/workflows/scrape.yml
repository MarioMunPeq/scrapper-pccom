name: pc-price-tracker

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    env:
      PYTHONUNBUFFERED: "1"

jobs:
  scrape:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Verificar datos actuales
        run: |
          if (Test-Path data/history.csv) {
            $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            $count = (Get-Content data/history.csv | Where-Object { $_ -match "^${today}," }).Count
            if ($count -gt 0) {
              Write-Output "Datos de hoy ya presentes en history.csv (${count} filas). Scrape omitido."
              exit 0
            }
          }
          Write-Output "Continuando con scrape programado..."

      - name: Preparar entorno
        run: |
          if (-not (Test-Path .venv)) {
            python -m venv .venv
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Ejecutar scraper
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          .\.venv\Scripts\python.exe scraper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guardar datos
        run: |
          if (-not (git status --porcelain data/)) {
            Write-Output "Sin cambios en data/"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: precios $(Get-Date -Format 'yyyy-MM-dd')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit 1 }