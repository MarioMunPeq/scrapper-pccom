name: Deploy Web

on:
  # Cuando se toca algún archivo en web/
  push:
    paths:
      - web/**
  # Ejecución manual desde la pestaña Actions
  workflow_dispatch:
  # Espera a que termine el workflow de scrape (los commits del bot no disparan push)
  workflow_run:
    workflows: ["pc-price-tracker"]
    types:
      - completed

concurrency:
  # Evita que se solapen despliegues; el nuevo reemplaza al anterior
  group: deploy-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ejecutar script de generación de precios
        # Este script lee los datos y genera web/public/data/prices.json
        # Siempre se ejecuta, aunque el scraper haya fallado, para asegurar
        # que los datos estén actualizados
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          folder: web/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4